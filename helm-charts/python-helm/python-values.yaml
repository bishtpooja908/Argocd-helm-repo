replicaCount: 2
# Deployment configuration
deployment:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
image:
  repository: "us-west1-docker.pkg.dev/prj-devops-anmol/generic-testing-repo/python-app"
  pullPolicy: Always
  tag: "104ff7caace99f0029da9b7171950d299e952b29" # updating CI/CD pipeline should override this with commit SHA
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
# Container configuration
container:
  port: 8501
  name: python-app
  envFrom:
    - secretRef:
        name: dev-secrets
  volumeMounts:
    - name: secrets-store-inline
      mountPath: "/mnt/secrets-store"
      readOnly: true
  args: []
  command: []
# Volume configuration
volumes:
  - name: secrets-store-inline
    csi:
      driver: secrets-store-gke.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "dev-secret-provider"
# Health check configuration
healthCheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /python/
      port: 8501
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /python/
      port: 8501
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
serviceAccount:
  create: true
  annotations: {}
  name: "generic-gke-sa"
  automountServiceAccountToken: true
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
nameOverride: python-app
service:
  type: ClusterIP
  port: 80
  targetPort: 8501
ingress:
  enabled: false # Disabled since we are using GKE Gateway
  className: ""
  annotations: {}
  hosts: []
  tls: []
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
networkPolicy:
  enabled: false
podDisruptionBudget:
  enabled: false
  minAvailable: 1
security:
  podSecurityStandards:
    enforce: "restricted"
    audit: "restricted"
    warn: "restricted"
  annotations: {}
# GKE Gateway (instead of Ingress)
gateway:
  enabled: true
  name: gke-gateway-external-lb
  namespace: dev
