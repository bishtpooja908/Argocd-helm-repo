replicaCount: 2

image:
  repository: gcr.io/YOUR_PROJECT_ID/react-app
  tag: "latest"
  pullPolicy: IfNotPresent

container:
  port: 3000   # React typically runs on 3000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

healthCheck:
  enabled: true
  path: "/"
  initialDelaySeconds: 10
  periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000

gateway:
  name: dev-gateway
  host: react.dev.example.com   # Replace with your domain
  namespace: dev
