# react-app/templates/gateway.yaml
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: react-gateway-route
spec:
  parentRefs:
    - name: gke-gateway-external-lb
      namespace: dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/react"
      backendRefs:
        - name: react-app
          port: 80
